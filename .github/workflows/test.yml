name: tests

# CI for the plugin's host-side Elixir surface — the same gate mob core runs,
# so a PR gets a green check instead of relying only on each contributor's
# local pre-push hook. Native code is compiled by the host app at deploy time,
# not here; this job covers the plugin's Elixir surface and the Eigen
# header/configure invariants in test/.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      # nx_eigen 0.1.1 ships no precompiled x86_64-linux NIF, so it builds from
      # source, and the runner has no FFTW3. The device build bundles its own
      # Eigen FFT bridge, so the host NIF can use upstream's stub FFT instead.
      # Same setting as release.yml.
      NX_EIGEN_FFT_LIB: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.19'
            otp: '28'
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      # nx_eigen 0.1.1 falls back to deps/nx_eigen/deps/fine/c_include for
      # fine.hpp, but Mix hoists Fine to deps/fine. Point the fallback at it,
      # as release.yml does.
      - name: Symlink Fine into nx_eigen's fallback include path
        run: |
          if [ -d deps/fine/c_include ] && [ ! -e deps/nx_eigen/deps/fine ]; then
            mkdir -p deps/nx_eigen/deps
            ln -s ../../fine deps/nx_eigen/deps/fine
          fi

      - run: mix deps.compile
      - run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      - name: Tests
        run: mix test --exclude macos_only --exclude requires_zig
